on:
  workflow_call:
    secrets:
      DEPENDENCYTRACK_APIKEY:
        description: The API key for Dependency Track
        required: true
    inputs:
      node_version:
        description: The nodejs version that is used for this workflow
        default: 24
        required: false
        type: number
      project_id:
        description: >-
          Deprecated and ignored. The Dependency Track project is now
          auto-created from the repository name and the git ref.
        required: false
        type: string
      dependency_track_url:
        description: >-
          The BOM upload URL of the Dependency Track instance. Defaults to the
          DEPENDENCYTRACK_URL configuration variable.
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  create-bom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate BOMs
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen -o sbom.json
      - name: Upload SBOM to DependencyTrack
        env:
          DT_API_URL: ${{ inputs.dependency_track_url || vars.DEPENDENCYTRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ github.ref_name }}
          LEGACY_PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$LEGACY_PROJECT_ID" ]; then
            echo "::warning::The project_id input is deprecated and ignored. The SBOM is uploaded to the auto-created project $PROJECT_NAME/$PROJECT_VERSION instead. Remove project_id from the calling workflow."
          fi

          response=$(curl -sS -X POST "$DT_API_URL" \
              --fail-with-body \
              -H "X-Api-Key: $DT_API_KEY" \
              -F "autoCreate=true" \
              -F "projectName=$PROJECT_NAME" \
              -F "projectVersion=$PROJECT_VERSION" \
              -F "bom=@sbom.json")

          token=$(printf '%s' "$response" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::DependencyTrack returned no processing token: $response"
            exit 1
          fi
          echo "Queued $PROJECT_NAME/$PROJECT_VERSION (token $token)"
