on:
    push:
        branches:
            - main
            - "[0-9]+.x"

permissions:
    contents: read

# Serialize releases across branches: semantic-release fetches all release
# branches' tags, and semantic-release-major-tag force-moves floating tags
# (v1, v2, ...). Concurrent runs can see a tag move mid-run and fail with
# "would clobber existing tag".
concurrency:
    group: release-workflows
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
